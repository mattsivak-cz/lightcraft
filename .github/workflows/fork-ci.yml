# CI for the mattsivak-cz/lightcraft fork: the same gate as `cargo xtask ci`, run on GitHub instead of locally.
# Branches live on the personal fork (mattsivak/lightcraft, where the upstream PRs come from); the
# pre-push hook mirrors each pushed branch to this org fork and runs CI here, because only an
# organization can use third-party runners (Depot).
#
# Feature branches are cut from upstream main, which has no CI workflow, and GitHub runs a `push`
# workflow from the pushed branch's own tree. So this workflow lives on the fork's `fork-ci` branch
# (never on main, which stays a plain mirror of upstream) and is started per branch with
# `workflow_dispatch --ref fork-ci`, passing the branch to test; it checks that branch out. The local
# `pre-push` hook (`.github/fork-ci/pre-push`, installed by `.github/fork-ci/install-hook.sh`)
# dispatches it after every push to the fork. By hand:
#   gh workflow run fork-ci.yml -R mattsivak-cz/lightcraft --ref fork-ci -f ref=<branch>
# The result is posted as a `fork-ci` commit status on the tested commit (visible on the fork's
# branch and commit pages) and as a run named after the branch in the fork's Actions tab.
#
# One job: `cargo xtask ci` (fmt, clippy, heif, tests, parity, layers, assets, wasm) on Linux with the
# craft-fonts input, on a Depot runner (depot-ubuntu-24.04: needs the Depot GitHub app on the
# mattsivak-cz org). The runner has no GPU, so the GPU tests skip; macOS and Windows aren't tested.
# A dispatch can pick another runner: a bigger Depot VM (`-f runner=depot-ubuntu-24.04-8`, the suffix is
# the vCPU count) or Blacksmith (`-f runner=blacksmith-8vcpu-ubuntu-2404`, needs its app on the org);
# such a run has its own concurrency group and posts `fork-ci (<runner>)`.
name: Fork CI
run-name: "CI ${{ inputs.ref || github.ref_name }}${{ inputs.sha && format(' @ {0}', inputs.sha) || '' }}${{ inputs.runner && inputs.runner != 'depot-ubuntu-24.04' && format(' on {0}', inputs.runner) || '' }}"

on:
  # changes to this workflow test themselves on the fork-ci branch
  push:
    branches: [fork-ci]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch (or tag) of this repository to test"
        type: string
        required: true
      sha:
        description: "Exact commit to test (empty: the branch's current head)"
        type: string
        default: ""
      runner:
        description: "Runner label"
        type: choice
        options:
          - depot-ubuntu-24.04
          - depot-ubuntu-24.04-4
          - depot-ubuntu-24.04-8
          - depot-ubuntu-24.04-16
          - depot-ubuntu-24.04-32
          - depot-ubuntu-24.04-64
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-16vcpu-ubuntu-2404
        default: depot-ubuntu-24.04

# A newer push of the same branch cancels the older run on the same runner.
concurrency:
  group: fork-ci-${{ inputs.ref || github.ref_name }}-${{ inputs.runner || 'depot-ubuntu-24.04' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # what `cargo xtask ci` uses: backtraces with line numbers, a fraction of full debuginfo's RAM and cache
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  CRAFT_FONTS_REF: 3d9ab3a132ed0eff457e424226a435a901da30d3 # same pin as release.yml

jobs:
  ci:
    name: Linux x86_64 (xtask ci)
    runs-on: ${{ inputs.runner || 'depot-ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: write
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STATUS_CONTEXT: ${{ (inputs.runner && inputs.runner != 'depot-ubuntu-24.04') && format('fork-ci ({0})', inputs.runner) || 'fork-ci' }}
    steps:
      - id: sha
        name: Resolve commit and mark pending
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [ -z "$SHA" ]; then
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          fi
          # the push may still be landing when the hook dispatches: wait for the commit to exist
          for _ in $(seq 30); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha >/dev/null 2>&1 && break
            sleep 10
          done
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .sha)
          echo "sha=$SHA" >>"$GITHUB_OUTPUT"
          echo "### Testing \`$REF\` at \`${SHA::9}\`" >>"$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="running" -f target_url="$RUN_URL" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      # Optional font build input, so the Japanese and Chinese font tests run (they skip without it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Dependencies only (rust-cache drops the workspace's own artifacts).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-ci
      - name: cargo xtask ci
        run: cargo xtask ci
      - name: CI report
        if: ${{ !cancelled() }}
        run: |
          if [ -f target/ci/summary.md ]; then cat target/ci/summary.md >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Post commit status
        if: ${{ always() && steps.sha.outputs.sha != '' }}
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          case "$RESULT" in
            success) state=success desc="passed" ;;
            cancelled) state=error desc="cancelled" ;;
            *) state=failure desc="failed" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=$state -f context="$STATUS_CONTEXT" \
            -f description="$desc" -f target_url="$RUN_URL" >/dev/null
